<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!-- Disable zooming: -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- change this to your project name -->
    <title>Extended Brookshear Machine UI</title>

    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->

    <link data-trunk rel="rust" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base data-trunk-public-url />

    <link data-trunk rel="icon" href="assets/favicon.ico">


    <link data-trunk rel="copy-file" href="assets/sw.js" />
    <link data-trunk rel="copy-file" href="assets/helpers.js" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <link data-trunk rel="copy-file" href="assets/favicon-192x192.png" data-target-path="assets" />
    <link data-trunk rel="copy-file" href="assets/favicon-512x512.png" data-target-path="assets" />
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" data-target-path="assets" />


    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <script type="importmap">{"imports":{"helpers": "./helpers.js"}}</script>

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <!-- the loading spinner will be removed in main.rs -->
    <div class="centered" id="loading_text">
        <noscript>You need javascript to use this website</noscript>
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <!-- Top-level panic / crash handler. Rust panics on wasm surface as uncaught RuntimeErrors. -->
    <div id="crash_overlay" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);color:#f0f0f0;font-family:Ubuntu-Light,Helvetica,sans-serif;overflow:auto;padding:24px;box-sizing:border-box">
        <h2>The app has crashed</h2>
        <p>An unexpected error occurred. Please
            <a id="crash_report_link" style="color:#8cf" href="https://github.com/ashley-hawkins/extended-brookshear-assembler/issues/new?title=Crash%20report" target="_blank" rel="noopener">report this issue on GitHub</a>
            and include the details below, then reload the page.</p>
        <button id="crash_copy" type="button" style="margin-bottom:8px;padding:6px 12px;font:inherit;cursor:pointer">Copy details</button>
        <pre id="crash_details" style="white-space:pre-wrap;background:#222;padding:12px;border-radius:4px;user-select:text"></pre>
    </div>
    <script>
        (function () {
            var shown = false;
            function show(msg) {
                var overlay = document.getElementById('crash_overlay');
                if (!overlay) return;
                var details = document.getElementById('crash_details');
                if (window.__panic_message) msg = window.__panic_message + '\n\n' + msg;
                var text = msg + '\n\nuser agent: ' + navigator.userAgent + '\nurl: ' + location.href;
                if (shown) { details.textContent += '\n\n---\n' + msg; return; }
                shown = true;
                details.textContent = text;
                // Prefill the issue with the details in a code fence, as the desktop crash window does.
                // Truncated to stay under GitHub's URL length limit.
                var link = document.getElementById('crash_report_link');
                if (link) {
                    link.href += '&body=' + encodeURIComponent('```\n' + text.slice(0, 3500) + '\n```');
                }
                overlay.style.display = 'block';
                var loading = document.getElementById('loading_text');
                if (loading) loading.remove();
            }
            var copyButton = document.getElementById('crash_copy');
            if (copyButton) {
                copyButton.addEventListener('click', function () {
                    var text = document.getElementById('crash_details').textContent;
                    function done(label) {
                        copyButton.textContent = label;
                        setTimeout(function () { copyButton.textContent = 'Copy details'; }, 2000);
                    }
                    function fallback() {
                        // navigator.clipboard needs a secure context; select + execCommand works elsewhere.
                        var range = document.createRange();
                        range.selectNodeContents(document.getElementById('crash_details'));
                        var sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                        done(document.execCommand('copy') ? 'Copied!' : 'Press Ctrl+C to copy');
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function () { done('Copied!'); }, fallback);
                    } else {
                        fallback();
                    }
                });
            }
            window.addEventListener('error', function (e) {
                var err = e.error;
                show((err && err.stack) || e.message || String(e));
            });
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                show((r && r.stack) || String(r));
            });
        })();
    </script>

    <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
    <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>
